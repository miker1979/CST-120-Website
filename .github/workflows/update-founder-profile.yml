name: Update Founder Profile

on:
  push:
    paths:
      - '.github/workflows/update-founder-profile.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Update founder profile
        run: python3 .github/scripts/update-founder-profile.py

      - name: Commit founder profile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-founder-profile.yml
          rm -f .github/scripts/update-founder-profile.py
          git add -A
          git commit -m "Update company founder profile"
          git push
