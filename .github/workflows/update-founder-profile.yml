name: Update Founder Profile

on:
  push:
    paths:
      - '.github/workflows/update-founder-profile.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Update founder profile
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/update_founder.py
          python3 /tmp/update_founder.py
          rm -f .github/workflows/update-founder-profile.yml

      - name: Commit founder profile update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add company.html .github/workflows/update-founder-profile.yml
          git commit -m "Update company founder profile"
          git push
