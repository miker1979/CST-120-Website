name: Update Founder Profile

on:
  push:
    paths:
      - '.github/workflows/update-founder-profile.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Update founder profile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('company.html')
          text = path.read_text(encoding='utf-8')

          replacement = r'''        <!-- =================================================
             FOUNDER
             ================================================= -->

        <section
            id="founder"
            class="section-padding section-dark">

            <div class="container">

                <div class="text-center mb-5">
                    <p class="section-label">Founder &amp; Leadership</p>
                    <h2 class="section-title">Michael Robinson</h2>
                    <p class="lead mx-auto" style="max-width: 900px;">
                        Founder of Ghostline Technology LLC, combining military service,
                        more than two decades of transportation and logistics experience,
                        software development, and entrepreneurship.
                    </p>
                </div>

                <div class="row">
                    <div class="col-lg-8 mb-4 mb-lg-0">
                        <article class="ghostline-card h-100">
                            <h3>Founder | Ghostline Technology LLC</h3>

                            <p class="text-muted-custom">
                                Michael Robinson is the founder of <strong>Ghostline Technology LLC</strong>,
                                an Arizona-based technology company focused on software development,
                                interactive applications, and game development. His path into technology
                                is built on a diverse professional background spanning military service,
                                transportation and logistics, education, and entrepreneurship.
                            </p>

                            <p class="text-muted-custom">
                                Born and raised in Phoenix, Arizona, Michael graduated from
                                <strong>Paradise Valley High School in May 1997</strong>. Shortly after
                                graduation, he enlisted in the <strong>United States Army in July 1997</strong>,
                                beginning his military career in the U.S. Army Chemical Corps. He served
                                until October 2000, gaining experience in disciplined operations,
                                accountability, teamwork, and performing under demanding conditions.
                                The principles developed during his military service—preparation,
                                adaptability, persistence, and attention to detail—continue to influence
                                his approach to both business and technology.
                            </p>

                            <p class="text-muted-custom">
                                Following his military service, Michael entered the transportation industry
                                and built a career spanning more than two decades as a professional truck
                                driver. His 22 years in commercial transportation provided extensive
                                firsthand experience with freight movement, logistics, operational
                                efficiency, regulatory requirements, and the everyday challenges faced by
                                drivers and transportation professionals. That experience later became
                                particularly valuable as he began exploring technology designed around
                                real-world operational problems.
                            </p>

                            <p class="text-muted-custom">
                                Driven by a growing interest in computers and programming, Michael returned
                                to higher education to pursue formal technology training. What began as an
                                interest in computer programming developed into a broader commitment to
                                <strong>software development, application design, and emerging technologies</strong>.
                                He continues to expand his technical expertise through Software Development
                                studies at <strong>Grand Canyon University</strong>, combining academic
                                instruction with extensive hands-on development work.
                            </p>

                            <p class="text-muted-custom">
                                Michael founded Ghostline Technology LLC as a platform for transforming ideas
                                and practical experience into working technology. The company’s development
                                efforts span business software, experimental applications, developer tools,
                                simulation concepts, and interactive entertainment. Transportation-focused
                                projects include <strong>TransitLogic</strong> and <strong>Fleet Track Pro</strong>,
                                alongside additional work in decision systems, productivity tools, and
                                software architecture.
                            </p>

                            <p class="text-muted-custom">
                                Ghostline Technology also serves as the parent company for
                                <strong>Haunted Echoes Studios</strong>, its interactive entertainment division.
                                Through Haunted Echoes Studios, Michael applies software engineering, game
                                design, historical research, environmental storytelling, and emerging
                                creative technologies to original games and interactive experiences.
                            </p>

                            <p class="text-muted-custom">
                                His development philosophy emphasizes experimentation and continuous
                                improvement. Rather than limiting projects to theoretical concepts, Michael
                                focuses on building functional prototypes, testing ideas, identifying
                                weaknesses, and refining systems through practical use.
                            </p>

                            <p class="text-muted-custom mb-0">
                                Today, from <strong>Maricopa, Arizona</strong>, Michael continues building
                                Ghostline Technology with a long-term focus on practical software,
                                innovative interactive experiences, and the belief that meaningful technology
                                often begins with understanding a problem firsthand.
                            </p>
                        </article>
                    </div>

                    <div class="col-lg-4">
                        <div class="ghostline-card h-100">
                            <div class="process-step">
                                <span class="process-number">01</span>
                                <div>
                                    <h3 class="h5">Education</h3>
                                    <p class="text-muted-custom mb-0">
                                        Paradise Valley High School, Class of May 1997; ongoing Software
                                        Development studies at Grand Canyon University.
                                    </p>
                                </div>
                            </div>

                            <div class="process-step">
                                <span class="process-number">02</span>
                                <div>
                                    <h3 class="h5">Military Service</h3>
                                    <p class="text-muted-custom mb-0">
                                        U.S. Army Chemical Corps, July 1997 to October 2000.
                                    </p>
                                </div>
                            </div>

                            <div class="process-step">
                                <span class="process-number">03</span>
                                <div>
                                    <h3 class="h5">Transportation &amp; Logistics</h3>
                                    <p class="text-muted-custom mb-0">
                                        22 years of professional commercial driving and firsthand logistics
                                        experience.
                                    </p>
                                </div>
                            </div>

                            <div class="process-step">
                                <span class="process-number">04</span>
                                <div>
                                    <h3 class="h5">Technology &amp; Entrepreneurship</h3>
                                    <p class="text-muted-custom mb-0">
                                        Founder of Ghostline Technology LLC with work spanning business
                                        software, development tools, prototypes, and interactive entertainment.
                                    </p>
                                </div>
                            </div>

                            <a href="contact.html" class="btn btn-ghostline mt-3">
                                Contact Ghostline Technology
                            </a>
                        </div>
                    </div>
                </div>

            </div>

        </section>


'''

          pattern = re.compile(
              r'        <!-- =================================================\n             FOUNDER\n             ================================================= -->.*?(?=        <!-- =================================================\n             EXPERIENCE INTO SOFTWARE)',
              re.S,
          )

          if not pattern.search(text):
              raise SystemExit('Founder section marker not found')

          text = pattern.sub(replacement, text, count=1)
          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/update-founder-profile.yml

      - name: Commit founder profile update
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add company.html .github/workflows/update-founder-profile.yml
          git commit -m "Update company founder profile"
          git push
