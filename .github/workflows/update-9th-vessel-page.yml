name: Update 9th Vessel Public Page

on:
  push:
    branches: [main]
    paths:
      - '.run-9th-vessel-page-update'

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh The 9th Vessel public page
        shell: python
        run: |
          from pathlib import Path

          path = Path('arizona-paranormal.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '<meta name="description" content="Arizona Paranormal Project — Jerome is a four-player cooperative paranormal investigation and survival-horror mystery from Haunted Echoes Studios, built around real Jerome, Arizona locations and a buried history that reaches far beyond one night in the mines.">': '<meta name="description" content="The 9th Vessel is a 1–4 player cooperative paranormal investigation and survival-horror mystery from Haunted Echoes Studios, set in modern-day Jerome, Arizona and built around real locations, adaptive supernatural pressure, and a fixed hidden history.">',
              '<meta property="og:title" content="Arizona Paranormal Project — Jerome | Haunted Echoes Studios">': '<meta property="og:title" content="The 9th Vessel | Haunted Echoes Studios">',
              '<meta property="og:description" content="Four investigators enter real Jerome locations and uncover a supernatural mystery whose roots reach much deeper than the town remembers.">': '<meta property="og:description" content="One to four investigators enter real Jerome locations and uncover a supernatural mystery whose roots reach much deeper than the town remembers.">',
              '<title>Arizona Paranormal Project — Jerome | Haunted Echoes Studios</title>': '<title>The 9th Vessel | Haunted Echoes Studios</title>',
              '<span class="location-status">Primary investigation hub</span></div><h3>Jerome Grand Hotel / United Verde Hospital</h3><p>Historic hospital and hotel layers anchor the modern investigation and the earliest major supernatural escalation.</p>': '<span class="location-status">Main investigation</span></div><h3>Jerome Grand Hotel / United Verde Hospital</h3><p>Historic hospital and hotel layers support evidence recovery, environmental storytelling, and escalating paranormal encounters without forcing a required first destination.</p>',
              'alt="Real-world photograph of the Jerome Episcopal Christ Church"': 'alt="Real-world photograph of Holy Family Church in Jerome"',
              'alt="Game render of the Jerome Episcopal Christ Church"': 'alt="Game render inspired by Holy Family Church in Jerome"',
              '<h3>Jerome Episcopal Christ Church</h3><p>A church location supporting the spiritual and historical side of the investigation.</p>': '<h3>Holy Family Church</h3><p>A historic church location supporting the spiritual, archival, and historical side of the investigation while keeping its deeper role hidden from the player at the start.</p>',
              'Arizona Paranormal Project — Jerome is being developed as a historically grounded supernatural mystery using real locations, a fixed underlying truth, adaptive encounters, and cooperative pressure.': 'The 9th Vessel is being developed as a historically grounded supernatural mystery using real Jerome locations, a fixed underlying truth, adaptive encounters, and cooperative pressure for 1–4 investigators.',
              '<a href="arizona-paranormal.html">Arizona Paranormal Project</a>': '<a href="arizona-paranormal.html">The 9th Vessel</a>',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Required source text not found: {old[:90]}')
              text = text.replace(old, new)

          old_hero = '''<section class="az-hero"><div class="container"><div class="row align-items-center"><div class="col-lg-6 mb-5 mb-lg-0"><p class="section-label">Haunted Echoes Studios — Current Canon</p><h1 class="az-title">Arizona Paranormal Project <span class="accent">— Jerome</span></h1><p class="lead">A four-investigator cooperative paranormal investigation and survival-horror mystery set in modern-day Jerome, Arizona.</p><p class="az-hero-copy">A historic mine disaster casts a shadow across modern-day Jerome. Four player-defined investigators enter real locations, follow evidence that changes position between runs, and discover that the town’s haunting reaches farther into the past than anyone expected.</p><div class="mt-4"><a href="#canon" class="btn btn-ghostline btn-lg mr-2 mb-2">Explore the Project</a><a href="#locations" class="btn btn-ghostline-outline btn-lg mb-2">View Jerome Locations</a></div><div class="mt-3"><span class="az-tag">Four Investigators</span><span class="az-tag">Real Jerome Locations</span><span class="az-tag">Historical Mystery</span><span class="az-tag">Unity</span></div></div><div class="col-lg-6"><figure class="az-showcase"><div class="az-showcase-head"><div><span>Current Visual Direction</span><br><strong>Jerome Grand Hotel Investigation</strong></div><span>Canon / Design Locked</span></div><a href="images/jerome-locations/Game/jerome-grand-hotel-game.png" target="_blank" rel="noopener noreferrer"><img src="images/jerome-locations/Game/jerome-grand-hotel-game.png" alt="First-person paranormal investigation outside the Jerome Grand Hotel at night"></a><figcaption>Current concept visualization of the first-person investigation style. The website now reflects the locked Jerome narrative and location framework rather than the earlier generic Arizona concept.</figcaption></figure></div></div></div></section>'''
          new_hero = '''<section class="az-hero"><div class="container"><div class="row align-items-center"><div class="col-lg-6 mb-5 mb-lg-0"><p class="section-label">Haunted Echoes Studios — Current Canon</p><h1 class="az-title">The 9th Vessel <span class="accent">— Jerome</span></h1><p class="lead">A 1–4 player cooperative paranormal investigation and survival-horror mystery set in modern-day Jerome, Arizona.</p><p class="az-hero-copy">During a Halloween festival in modern-day Jerome, player-defined investigators join what appears to be a recreational ghost hunt. Evidence shifts between runs, familiar locations become increasingly unreliable, and the team discovers that Jerome’s haunted reputation hides a history far older and more dangerous than anyone expected.</p><div class="mt-4"><a href="#canon" class="btn btn-ghostline btn-lg mr-2 mb-2">Explore the Project</a><a href="#locations" class="btn btn-ghostline-outline btn-lg mb-2">View Jerome Locations</a></div><div class="mt-3"><span class="az-tag">1–4 Investigators</span><span class="az-tag">Real Jerome Locations</span><span class="az-tag">Historical Mystery</span><span class="az-tag">Unity</span></div></div><div class="col-lg-6"><figure class="az-showcase"><div class="az-showcase-head"><div><span>Current Visual Direction</span><br><strong>Jerome Grand Hotel Investigation</strong></div><span>Canon / Design Locked</span></div><a href="images/jerome-locations/Game/jerome-grand-hotel-game.png" target="_blank" rel="noopener noreferrer"><img src="images/jerome-locations/Game/jerome-grand-hotel-game.png" alt="First-person paranormal investigation outside the Jerome Grand Hotel at night"></a><figcaption>Current concept visualization of the first-person investigation style. The public page reflects the locked Jerome setting and gameplay direction while preserving the story’s central secrets for players to uncover in-game.</figcaption></figure></div></div></div></section>'''
          if old_hero not in text:
              raise SystemExit('Hero block did not match current page')
          text = text.replace(old_hero, new_hero)

          old_canon = '''<section id="canon" class="az-section"><div class="container"><div class="text-center mb-5"><p class="section-label">Story Foundation</p><h2 class="section-title">The mystery has a <span class="az-accent">fixed truth.</span></h2><p class="lead az-lead">Replayability comes from where evidence appears, how encounters unfold, and how the AI Director pressures the team — not from changing what actually happened in 1928.</p></div><div class="canon-banner mb-5"><h3>A Mystery Buried Beneath Jerome</h3><p class="mb-0">The official story chronology now reaches back generations before the events of 1928. The public website will preserve that mystery: players must uncover the identities, motives, betrayals, and true purpose of the investigation inside the game.</p></div><div class="row"><div class="col-lg-4 mb-4"><article class="az-card"><h3>Investigate</h3><p class="mb-0">All 12 main locations are canonical story spaces. Clues and events can move between valid positions, but the underlying history remains consistent.</p></article></div><div class="col-lg-4 mb-4"><article class="az-card gold"><h3>Interpret</h3><p class="mb-0">Evidence is more than a collectible score. The team must connect testimony, encounters, locations, and impossible events to understand what happened.</p></article></div><div class="col-lg-4 mb-4"><article class="az-card cyan"><h3>Choose</h3><p class="mb-0">What the investigators learn—and what they fail to understand—changes the choices available when Jerome’s buried history finally catches up with them.</p></article></div></div></div></section>'''
          new_canon = '''<section id="canon" class="az-section"><div class="container"><div class="text-center mb-5"><p class="section-label">Story Foundation</p><h2 class="section-title">The mystery has a <span class="az-accent">fixed truth.</span></h2><p class="lead az-lead">Replayability comes from where evidence appears, how encounters unfold, and how the AI Director pressures the team — not from changing the hidden history beneath Jerome.</p></div><div class="canon-banner mb-5"><h3>A Mystery Buried Beneath Jerome</h3><p class="mb-0">The internal chronology reaches back centuries before the modern investigation. The public website intentionally protects that history: identities, motives, buried events, supernatural rules, and the true purpose of the investigation must be discovered inside the game.</p></div><div class="row"><div class="col-lg-4 mb-4"><article class="az-card"><h3>Investigate</h3><p class="mb-0">All 12 main locations are canonical story spaces. Clues and events can move between valid positions, but the underlying history remains consistent.</p></article></div><div class="col-lg-4 mb-4"><article class="az-card gold"><h3>Interpret</h3><p class="mb-0">Evidence is more than a collectible score. The team must connect testimony, encounters, locations, and impossible events to understand what happened.</p></article></div><div class="col-lg-4 mb-4"><article class="az-card cyan"><h3>Choose</h3><p class="mb-0">What the investigators learn—and what they fail to understand—changes the choices available when Jerome’s buried history finally catches up with them.</p></article></div></div></div></section>'''
          if old_canon not in text:
              raise SystemExit('Canon block did not match current page')
          text = text.replace(old_canon, new_canon)

          # The old public Anchor gallery exposed all eight miners and their fixed supernatural locations.
          # Replace it with a spoiler-safe environment preview.
          start = text.find('<section id="anchors" class="az-section">')
          end_marker = '<section class="az-section-alt"><div class="container"><div class="text-center mb-5"><p class="section-label">Spoiler-Free Systems Preview</p>'
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Anchor gallery bounds not found')
          spoiler_safe = '''<section class="az-section"><div class="container"><div class="text-center mb-5"><p class="section-label">Original Investigation Environments</p><h2 class="section-title">Jerome expands beyond the <span class="az-accent">public landmarks.</span></h2><p class="lead az-lead">The campaign also includes original mining, industrial, archival, and underground environments inspired by Jerome’s history. Their names, narrative connections, and supernatural purpose are intentionally withheld from the public page so those discoveries happen in-game.</p></div><div class="row"><div class="col-lg-4 mb-4"><article class="az-card"><h3>Mining Infrastructure</h3><p class="mb-0">Original industrial spaces draw from shafts, hoists, drainage systems, survey work, and mining operations without claiming to reproduce undocumented historical interiors.</p></article></div><div class="col-lg-4 mb-4"><article class="az-card gold"><h3>Evidence-Driven Discovery</h3><p class="mb-0">Players learn why these environments matter by investigating them, not by receiving their significance from a map legend or website description.</p></article></div><div class="col-lg-4 mb-4"><article class="az-card cyan"><h3>Spoiler Protection</h3><p class="mb-0">Character identities, supernatural relationships, hidden locations, and resolution mechanics remain part of the mystery until the team uncovers them.</p></article></div></div></div></section>\n'''
          text = text[:start] + spoiler_safe + text[end:]

          forbidden = [
              'Arizona Paranormal Project',
              'what actually happened in 1928',
              'events of 1928',
              'Jerome Episcopal Christ Church',
              'Jack &ldquo;Ironhand&rdquo; Calloway',
          ]
          for item in forbidden:
              if item in text:
                  raise SystemExit(f'Stale public content remains: {item}')

          path.write_text(text, encoding='utf-8')

          # Keep the existing URL but refresh sitemap metadata.
          sitemap = Path('sitemap.xml')
          s = sitemap.read_text(encoding='utf-8')
          target = '    <loc>https://ghostlinetech.com/arizona-paranormal.html</loc>'
          if target in s and target + '\n    <lastmod>2026-08-20</lastmod>' not in s:
              s = s.replace(target, target + '\n    <lastmod>2026-08-20</lastmod>')
              sitemap.write_text(s, encoding='utf-8')

      - name: Remove temporary trigger and workflow
        run: |
          rm -f .run-9th-vessel-page-update
          rm -f .github/workflows/update-9th-vessel-page.yml

      - name: Commit updated public page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arizona-paranormal.html sitemap.xml .github/workflows/update-9th-vessel-page.yml .run-9th-vessel-page-update
          git commit -m "Refresh The 9th Vessel public project page"

          for attempt in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
