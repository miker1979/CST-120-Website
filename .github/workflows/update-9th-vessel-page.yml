name: Update 9th Vessel Public Page

on:
  push:
    branches: [main]
    paths:
      - '.run-9th-vessel-page-update-v2'

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh The 9th Vessel public page
        shell: python
        run: |
          from pathlib import Path

          path = Path('arizona-paranormal.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'content="The 9th Vessel is a four-player cooperative paranormal investigation and survival-horror mystery from Haunted Echoes Studios, built around real Jerome, Arizona locations and a buried history that reaches far beyond one night in the mines."': 'content="The 9th Vessel is a 1–4 player cooperative paranormal investigation and survival-horror mystery from Haunted Echoes Studios, set in modern-day Jerome, Arizona and built around real locations, adaptive supernatural pressure, and a fixed hidden history."',
              'content="Four investigators enter real Jerome locations and uncover a supernatural mystery whose roots reach much deeper than the town remembers."': 'content="One to four investigators enter real Jerome locations and uncover a supernatural mystery whose roots reach much deeper than the town remembers."',
              '<p class="lead">A four-investigator cooperative paranormal investigation and survival-horror mystery set in modern-day Jerome, Arizona.</p>': '<p class="lead">A 1–4 player cooperative paranormal investigation and survival-horror mystery set in modern-day Jerome, Arizona.</p>',
              '<p class="az-hero-copy">A historic mine disaster casts a shadow across modern-day Jerome. Four player-defined investigators enter real locations, follow evidence that changes position between runs, and discover that the town’s haunting reaches farther into the past than anyone expected.</p>': '<p class="az-hero-copy">During a Halloween festival in modern-day Jerome, player-defined investigators join what appears to be a recreational ghost hunt. Evidence shifts between runs, familiar locations become increasingly unreliable, and the team discovers that Jerome’s haunted reputation hides a history far older and more dangerous than anyone expected.</p>',
              '<span class="az-tag">Four Investigators</span>': '<span class="az-tag">1–4 Investigators</span>',
              '<figcaption>Official concept cover art for the cooperative paranormal investigation set across Jerome, Arizona.</figcaption>': '<figcaption>Official concept cover art for The 9th Vessel. The public page presents the setting and gameplay direction while preserving the story’s central secrets for players to uncover in-game.</figcaption>',
              'Replayability comes from where evidence appears, how encounters unfold, and how the AI Director pressures the team — not from changing what actually happened in 1928.': 'Replayability comes from where evidence appears, how encounters unfold, and how the AI Director pressures the team — not from changing the hidden history beneath Jerome.',
              'The official story chronology now reaches back generations before the events of 1928. The public website will preserve that mystery: players must uncover the identities, motives, betrayals, and true purpose of the investigation inside the game.': 'The internal chronology reaches back centuries before the modern investigation. The public website intentionally protects that history: identities, motives, buried events, supernatural rules, and the true purpose of the investigation must be discovered inside the game.',
              '<span class="location-status">Primary investigation hub</span></div><h3>Jerome Grand Hotel / United Verde Hospital</h3><p>Historic hospital and hotel layers anchor the modern investigation and the earliest major supernatural escalation.</p>': '<span class="location-status">Main investigation</span></div><h3>Jerome Grand Hotel / United Verde Hospital</h3><p>Historic hospital and hotel layers support evidence recovery, environmental storytelling, and escalating paranormal encounters without forcing a required first destination.</p>',
              'alt="Real-world photograph of the Jerome Episcopal Christ Church"': 'alt="Real-world photograph of Holy Family Church in Jerome"',
              'alt="Game render of the Jerome Episcopal Christ Church"': 'alt="Game render inspired by Holy Family Church in Jerome"',
              '<h3>Jerome Episcopal Christ Church</h3><p>A church location supporting the spiritual and historical side of the investigation.</p>': '<h3>Holy Family Church</h3><p>A historic church location supporting the spiritual, archival, and historical side of the investigation while keeping its deeper role hidden from the player at the start.</p>',
              'The 9th Vessel is being developed as a historically grounded supernatural mystery using real locations, a fixed underlying truth, adaptive encounters, and cooperative pressure.': 'The 9th Vessel is being developed as a historically grounded supernatural mystery using real Jerome locations, a fixed underlying truth, adaptive encounters, and cooperative pressure for 1–4 investigators.',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Required source text not found: {old[:100]}')
              text = text.replace(old, new)

          start = text.find('<section id="anchors" class="az-section">')
          end_marker = '<section class="az-section-alt"><div class="container"><div class="text-center mb-5"><p class="section-label">Spoiler-Free Systems Preview</p>'
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Anchor gallery bounds not found')

          spoiler_safe = '''<section class="az-section"><div class="container"><div class="text-center mb-5"><p class="section-label">Original Investigation Environments</p><h2 class="section-title">Jerome expands beyond the <span class="az-accent">public landmarks.</span></h2><p class="lead az-lead">The campaign also includes original mining, industrial, archival, and underground environments inspired by Jerome’s history. Their names, narrative connections, and supernatural purpose are intentionally withheld from the public page so those discoveries happen in-game.</p></div><div class="row"><div class="col-lg-4 mb-4"><article class="az-card"><h3>Mining Infrastructure</h3><p class="mb-0">Original industrial spaces draw from shafts, hoists, drainage systems, survey work, and mining operations without claiming to reproduce undocumented historical interiors.</p></article></div><div class="col-lg-4 mb-4"><article class="az-card gold"><h3>Evidence-Driven Discovery</h3><p class="mb-0">Players learn why these environments matter by investigating them, not by receiving their significance from a map legend or website description.</p></article></div><div class="col-lg-4 mb-4"><article class="az-card cyan"><h3>Spoiler Protection</h3><p class="mb-0">Character identities, supernatural relationships, hidden locations, and resolution mechanics remain part of the mystery until the team uncovers them.</p></article></div></div></div></section>\n\n'''
          text = text[:start] + spoiler_safe + text[end:]

          forbidden = [
              '1928',
              'Jerome Episcopal Christ Church',
              'Jack &ldquo;Ironhand&rdquo; Calloway',
              'Samuel &ldquo;Blaze&rdquo; McKenna',
              '<p class="section-label">The Eight Anchor Points</p>',
          ]
          for item in forbidden:
              if item in text:
                  raise SystemExit(f'Stale or spoiler-heavy public content remains: {item}')

          path.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          s = sitemap.read_text(encoding='utf-8')
          target = '    <loc>https://ghostlinetech.com/arizona-paranormal.html</loc>'
          lastmod = '    <lastmod>2026-08-20</lastmod>'
          if target in s and target + '\n' + lastmod not in s:
              s = s.replace(target, target + '\n' + lastmod)
              sitemap.write_text(s, encoding='utf-8')

      - name: Remove temporary update files
        run: |
          rm -f .run-9th-vessel-page-update
          rm -f .run-9th-vessel-page-update-v2
          rm -f .github/workflows/update-9th-vessel-page.yml

      - name: Commit updated public page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh The 9th Vessel public project page"

          for attempt in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
