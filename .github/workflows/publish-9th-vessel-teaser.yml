name: Publish The 9th Vessel Teaser

on:
  push:
    paths:
      - '.video-upload/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Assemble teaser and update game page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Video
          cat .video-upload/part-* | base64 --decode > Video/the-9th-vessel-gameplay-concept.mp4
          python3 .github/scripts/publish-9th-vessel-teaser.py
          rm -rf .video-upload
          rm -f tmp-tool-test.txt video-publish-note.txt
          rm -f .github/workflows/publish-9th-vessel-teaser.yml
          rm -f .github/scripts/publish-9th-vessel-teaser.py

      - name: Commit published teaser
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish The 9th Vessel gameplay concept teaser"
          git push
