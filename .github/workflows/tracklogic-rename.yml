name: TrackLogic Website Rename

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tracklogic-rename.yml'

permissions:
  contents: write

jobs:
  rename-tracklogic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update TrackLogic branding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('labs.html'): [
                  ('<!-- Passenger rail planner -->', '<!-- TrackLogic -->'),
                  ('Intercity Passenger Rail Planner', 'TrackLogic'),
                  ('A national passenger-rail planning and ticketing\n                                concept built around realistic routes, stations,\n                                cabin inventory, transfers, schedules, and\n                                demand.',
                   'A national passenger-rail network simulator and ticketing\n                                prototype built around realistic routes, stations,\n                                train inventory, transfers, schedules, services,\n                                and demand.'),
                  ('Cabin inventory without overbooking', 'Train and seat inventory'),
                  ('Local and nonstop services', 'Regional and National Hub services'),
              ],
              Path('development-log.html'): [
                  ('<strong>High-Speed Rail:</strong> Beyond the Rails', '<strong>TrackLogic:</strong> TrackLogic'),
                  ('August 28 Beyond the Rails reservation-system and route-build work', 'August 28 TrackLogic reservation-system and route-build work'),
                  ('Ghostline Software / Beyond the Rails', 'Ghostline Software / TrackLogic'),
                  ('Beyond the Rails moved another step', 'TrackLogic moved another step'),
                  ('front end for the Beyond the Rails network model', 'front end for the TrackLogic network model'),
                  ('Beyond the Rails has moved from designing', 'TrackLogic has moved from designing'),
                  ('Beyond the Rails continued its move', 'TrackLogic continued its move'),
                  ('Beyond the Rails can now represent', 'TrackLogic can now represent'),
                  ('Beyond the Rails advanced from a highway-and-station', 'TrackLogic advanced from a highway-and-station'),
                  ('Ghostline Software / High-Speed Rail Simulator', 'Ghostline Software / TrackLogic'),
                  ('Beyond the Rails: nationwide trip booking expands to the full rail network', 'TrackLogic: nationwide trip booking expands to the full rail network'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/tracklogic-rename.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit website rename
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update website branding to TrackLogic"
          git push
