name: Apply August 11 ChoiceMaker Discovery Update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-2026-08-11-choicemaker-discovery.yml"
      - "scripts/apply-2026-08-11-choicemaker-discovery.py"

permissions:
  contents: write

jobs:
  update-choicemaker-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add ChoiceMaker discovery cards
        run: python scripts/apply-2026-08-11-choicemaker-discovery.py

      - name: Commit website changes
        run: |
          if git diff --quiet -- index.html labs.html; then
            echo "ChoiceMaker discovery updates are already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html labs.html
          git commit -m "Feature ChoiceMaker on home and Labs pages [skip ci]"
          git push
