name: One-time fix 9th Vessel cover path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-9th-vessel-cover-path.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Point site to PNG cover
        shell: bash
        run: |
          sed -i 's/the-9th-vessel-cover\.jpg/the-9th-vessel-cover.png/g' haunted-echoes.html arizona-paranormal.html

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-9th-vessel-cover-path.yml
          git config user.name 'ghostline-site-bot'
          git config user.email '149340718+miker1979@users.noreply.github.com'
          git add haunted-echoes.html arizona-paranormal.html .github/workflows/fix-9th-vessel-cover-path.yml
          git commit -m 'Fix The 9th Vessel cover image path' || exit 0
          git push
