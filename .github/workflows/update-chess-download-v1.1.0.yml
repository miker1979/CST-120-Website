name: Update Chess Download to v1.1.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-chess-download-v1.1.0.yml"

permissions:
  contents: write

jobs:
  update-download:
    name: Point website to Ghostline Chess v1.1.0
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update download links and labels
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "ghostline_chess.html"
          $content = Get-Content $path -Raw
          $oldCount = ([regex]::Matches($content, [regex]::Escape("1.0.0"))).Count

          if ($oldCount -eq 0) {
            throw "No v1.0.0 references were found in $path."
          }

          $updated = $content.Replace("1.0.0", "1.1.0")
          $expectedUrl = "https://github.com/miker1979/Ghostline-Chess/releases/download/v1.1.0/GhostlineChess-v1.1.0-win-x64.zip"

          if (-not $updated.Contains($expectedUrl)) {
            throw "The expected v1.1.0 download URL was not produced."
          }
          if ($updated.Contains("1.0.0")) {
            throw "A stale v1.0.0 reference remains in $path."
          }

          Set-Content -Path $path -Value $updated -Encoding utf8
          Write-Host "Updated $oldCount version references to v1.1.0."

      - name: Commit website update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghostline_chess.html
          if git diff --cached --quiet; then
            echo "No website changes to commit."
            exit 0
          fi
          git commit -m "Update Ghostline Chess download to v1.1.0"
          git push origin main
