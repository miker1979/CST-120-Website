name: Apply August 11 Software Development SEO Update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-2026-08-11-software-development-seo.yml"
      - "scripts/apply-2026-08-11-software-development-seo.py"
      - "software-development.html"
      - "sitemap.xml"
      - "robots.txt"

permissions:
  contents: write

jobs:
  update-software-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply software-development SEO updates
        run: python scripts/apply-2026-08-11-software-development-seo.py

      - name: Commit internal-link and metadata updates
        run: |
          if git diff --quiet; then
            echo "Software-development SEO updates are already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html software.html company.html labs.html choicemaker.html contact.html haunted-echoes.html development-log.html construction-ops.html load-board.html broker-operations.html ghostline-chess.html arizona-paranormal.html boston-ripper.html software-development.html sitemap.xml robots.txt
          git commit -m "Add software development SEO links and metadata [skip ci]"
          git push
