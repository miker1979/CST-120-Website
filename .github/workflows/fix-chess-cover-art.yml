name: Fix Ghostline Chess Cover Art

on:
  push:
    paths:
      - '.fix-chess-cover-art'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Point pages to corrected cover art
        shell: bash
        run: |
          set -euo pipefail
          test -f Images/chess_cover_art2.png
          python3 - <<'PY'
          from pathlib import Path

          pages = [Path('ghostline-chess.html'), Path('haunted-echoes.html')]
          old = 'images/ghostline-chess-cover-art.webp'
          new = 'Images/chess_cover_art2.png'

          total = 0
          for page in pages:
              text = page.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'{page}: expected old cover art reference not found')
              page.write_text(text.replace(old, new), encoding='utf-8')
              total += count
              print(f'{page}: replaced {count} reference(s)')

          print(f'Total replacements: {total}')
          PY

      - name: Commit corrected cover art references
        shell: bash
        run: |
          set -euo pipefail
          rm -f .fix-chess-cover-art
          rm -f .github/workflows/fix-chess-cover-art.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use corrected Ghostline Chess cover artwork"
          git push
