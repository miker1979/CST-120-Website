name: One-time direct cover path fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cover-path-api.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Update cover references through GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request, urllib.parse

          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          branch = 'main'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ghostline-cover-path-fix'
          }

          def request(method, api_path, payload=None):
              url = f'https://api.github.com/repos/{repo}/{api_path}'
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode('utf-8')) if resp.length != 0 else {}

          for path in ['haunted-echoes.html', 'arizona-paranormal.html']:
              encoded = urllib.parse.quote(path, safe='/')
              item = request('GET', f'contents/{encoded}?ref={branch}')
              text = base64.b64decode(item['content']).decode('utf-8')
              updated = text.replace('the-9th-vessel-cover.jpg', 'the-9th-vessel-cover.png')
              if updated == text:
                  print(f'No JPG reference found in {path}')
                  continue
              request('PUT', f'contents/{encoded}', {
                  'message': f'Fix The 9th Vessel cover path in {path}',
                  'content': base64.b64encode(updated.encode('utf-8')).decode('ascii'),
                  'sha': item['sha'],
                  'branch': branch
              })
              print(f'Updated {path}')
          PY
