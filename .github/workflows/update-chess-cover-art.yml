name: Publish Ghostline Chess Cover Art

on:
  push:
    paths:
      - '.update-chess-cover-art'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Update Ghostline Chess artwork and logs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # ---------------- Ghostline Chess project page ----------------
          page = Path('ghostline-chess.html')
          text = page.read_text(encoding='utf-8')

          text = text.replace(
              'https://ghostlinetech.com/images/ghostline-chess-social-card-v1-2.png',
              'https://ghostlinetech.com/images/ghostline-chess-cover-art.webp'
          )

          old_css = '        .panel img { width:100%; display:block; }\n'
          new_css = '''        .panel img { width:100%; display:block; }\n        .concept-caption { padding:.8rem 1rem; margin:0; font-size:.84rem; background:rgba(142,23,48,.08); border-top:1px solid rgba(142,23,48,.2); }\n        .build-shot { width:100%; border-radius:16px; border:1px solid #cbd5e1; box-shadow:0 16px 38px rgba(15,23,42,.1); }\n'''
          if old_css not in text:
              raise SystemExit('Ghostline Chess CSS anchor missing')
          text = text.replace(old_css, new_css, 1)

          old_hero = '<div class="col-lg-6"><figure class="panel"><a href="images/ghostline-chess-v2.png" target="_blank" rel="noopener noreferrer"><img src="images/ghostline-chess-v2.png" alt="Current Ghostline Chess interface with gothic board, Tome, Graveyard, AI controls, themes, audio controls, and compact game controls"></a></figure></div>'
          new_hero = '<div class="col-lg-6"><figure class="panel"><a href="images/ghostline-chess-cover-art.webp" target="_blank" rel="noopener noreferrer"><img src="images/ghostline-chess-cover-art.webp" alt="Official Ghostline Chess concept cover artwork showing the Hallowed Saints facing the Damned beneath the lantern-bearing haunted referee"></a><figcaption class="concept-caption"><strong>Official concept / cover artwork.</strong> Promotional key art for The Hallowed Saints vs. The Damned. The current playable interface is shown below.</figcaption></figure></div>'
          if old_hero not in text:
              raise SystemExit('Ghostline Chess hero image anchor missing')
          text = text.replace(old_hero, new_hero, 1)

          insert_anchor = '''    </section>\n\n    <section class="section-pad alt">\n        <div class="container"><div class="row align-items-center">\n            <div class="col-lg-6 mb-4"><img class="img-fluid rounded shadow" src="images/ghostline-chess-web-card-v1-2.png" alt="Ghostline Chess version 1.2.0 website card"></div>'''
          build_section = '''    </section>\n\n    <section class="section-pad alt">\n        <div class="container"><div class="row align-items-center">\n            <div class="col-lg-5 mb-4 mb-lg-0">\n                <p class="section-label">Current Development Build</p>\n                <h2>Concept art above. <span class="gold">Playable interface here.</span></h2>\n                <p>The cover artwork establishes the Ghostline Chess identity, while this screenshot shows the actual Windows build currently being tested.</p>\n                <ul class="release-list"><li>Hallowed Saints vs. The Damned board presentation</li><li>Easy, Normal, and Hard AI selector</li><li>Full-square legal-move and capture highlighting</li><li>Oxblood Chapel, Crypt, and Moonlit Graveyard themes</li><li>Tome, Graveyard, FEN, theme, and audio controls</li></ul>\n            </div>\n            <div class="col-lg-7"><a href="images/ghostline-chess-v2.png" target="_blank" rel="noopener noreferrer"><img class="build-shot" src="images/ghostline-chess-v2.png" alt="Current Ghostline Chess playable Windows interface"></a><p class="small mt-2 mb-0"><strong>Current development build screenshot.</strong> This is the actual playable desktop interface, not concept art.</p></div>\n        </div></div>\n    </section>\n\n    <section class="section-pad">\n        <div class="container"><div class="row align-items-center">\n            <div class="col-lg-6 mb-4"><img class="img-fluid rounded shadow" src="images/ghostline-chess-web-card-v1-2.png" alt="Ghostline Chess version 1.2.0 website card"></div>'''
          if insert_anchor not in text:
              raise SystemExit('Ghostline Chess download-section anchor missing')
          text = text.replace(insert_anchor, build_section, 1)
          page.write_text(text, encoding='utf-8')

          # ---------------- Haunted Echoes studio page ----------------
          studio = Path('haunted-echoes.html')
          studio_text = studio.read_text(encoding='utf-8')
          old_studio_image = '<div class="col-lg-6 mb-4 mb-lg-0"><img src="images/ghostline-chess-v2.png" alt="Ghostline Chess gothic board with the Hallowed Saints, Damned Souls, Tome, and Graveyard" class="hero-logo"></div>'
          new_studio_image = '''<div class="col-lg-6 mb-4 mb-lg-0">\n                        <img src="images/ghostline-chess-cover-art.webp" alt="Official Ghostline Chess concept cover art featuring the Hallowed Saints vs. the Damned" class="hero-logo">\n                        <p class="text-muted-custom small mt-3 mb-3"><strong>Official concept / cover artwork:</strong> The Hallowed Saints vs. The Damned.</p>\n                        <img src="images/ghostline-chess-v2.png" alt="Current playable Ghostline Chess Windows interface" class="img-fluid rounded" loading="lazy">\n                        <p class="text-muted-custom small mt-2 mb-0"><strong>Current development build:</strong> actual playable interface shown for accuracy.</p>\n                    </div>'''
          if old_studio_image not in studio_text:
              raise SystemExit('Haunted Echoes Chess image anchor missing')
          studio_text = studio_text.replace(old_studio_image, new_studio_image, 1)
          studio.write_text(studio_text, encoding='utf-8')

          # ---------------- Detailed Ghostline Chess development log ----------------
          chess_log = Path('ghostline-chess-development-log.html')
          log_text = chess_log.read_text(encoding='utf-8')
          log_anchor = '    <article class="log"><span class="date">August 15, 2026 · Development Build</span><h2>Difficulty selection and visual-readability refresh</h2>'
          new_log_entry = '''    <article class="log"><span class="date">August 15, 2026 · Website / Art Direction</span><h2>Official cover artwork added</h2><p>The public Ghostline Chess presentation now separates promotional key art from the real playable interface.</p><ul><li>Added the official concept/cover artwork featuring the canonical <strong>Hallowed Saints vs. The Damned</strong> faction naming.</li><li>Moved the cover art into the main project-page hero position as promotional key art.</li><li>Kept the actual Windows gameplay screenshot in a dedicated <strong>Current Development Build</strong> section so visitors can clearly distinguish concept art from the live interface.</li><li>Updated the Haunted Echoes Studios playable-release card to show both the official cover artwork and the current build screenshot.</li><li>Updated social-preview metadata to use the new cover artwork.</li></ul><p><strong>Status:</strong> website art direction now matches the current Ghostline Chess identity while preserving an accurate view of the playable build.</p></article>\n'''
          if log_anchor not in log_text:
              raise SystemExit('Detailed Chess log anchor missing')
          log_text = log_text.replace(log_anchor, new_log_entry + log_anchor, 1)
          chess_log.write_text(log_text, encoding='utf-8')

          # ---------------- Company development log ----------------
          company_log = Path('development-log.html')
          company_text = company_log.read_text(encoding='utf-8')
          old_website_snapshot = '<p><strong>Website:</strong> the Ghostline Chess project page, Haunted Echoes playable-release card, and development logs now reflect the August 15 usability and visual refresh; The 9th Vessel gameplay teaser was also restored with the complete source video.</p>'
          new_website_snapshot = '<p><strong>Website:</strong> the Ghostline Chess project page now uses official Hallowed Saints vs. The Damned cover art while keeping the actual playable interface clearly labeled; the Haunted Echoes card and development logs are synchronized, and The 9th Vessel gameplay teaser remains restored.</p>'
          if old_website_snapshot not in company_text:
              raise SystemExit('Company Website snapshot anchor missing')
          company_text = company_text.replace(old_website_snapshot, new_website_snapshot, 1)

          old_bullet = '<li>Replaced the washed-out Ghostline Chess website image with the current interface screenshot showing the board, Tome, Graveyard, AI selector, board-theme selector, and audio controls.</li>'
          new_bullets = old_bullet + '<li>Added official Ghostline Chess concept/cover artwork using the canonical Hallowed Saints vs. The Damned naming, while keeping the actual playable screenshot clearly identified as the current development build.</li>'
          if old_bullet not in company_text:
              raise SystemExit('Company Ghostline Chess screenshot bullet missing')
          company_text = company_text.replace(old_bullet, new_bullets, 1)
          company_log.write_text(company_text, encoding='utf-8')
          PY

      - name: Commit cover-art website update
        shell: bash
        run: |
          set -euo pipefail
          rm -f .update-chess-cover-art
          rm -f .github/workflows/update-chess-cover-art.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Ghostline Chess cover art and update logs"
          git push
