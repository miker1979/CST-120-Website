name: Update Haunted Echoes Chess Card and Dev Log

on:
  push:
    paths:
      - '.update-haunted-echoes-chess-card'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Update Haunted Echoes Chess card and company dev log
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('haunted-echoes.html')
          text = page.read_text(encoding='utf-8')

          replacements = {
              'The studio’s active playable release features a complete chess engine, a gothic identity, tactical AI, and a working layered audio system.':
              'The studio’s active playable release now pairs a complete chess engine with selectable AI difficulty, full-square move highlighting, three horror board themes, a refined desktop layout, and layered audio.',

              '<span class="product-tag">Tactical AI Release Milestone</span><h3 class="mt-3">Ghostline Chess</h3>':
              '<span class="product-tag">August 2026 Visual &amp; Difficulty Refresh</span><h3 class="mt-3">Ghostline Chess</h3>',

              'The current milestone combines a tactical computer opponent with a continuous 5:50 background suite, randomized environmental creaks, and faction-and-piece move and capture cues.':
              'The current development build adds Easy, Normal, and Hard AI choices, replaces the old circular legal-move markers with full-square destination and capture highlighting, introduces Oxblood Chapel, Crypt, and Moonlit Graveyard board themes, and organizes the Tome, Graveyard, FEN, AI, theme, and audio controls into a cleaner right-side command area.',

              '<ul class="product-list mb-4"><li>Custom Hallowed Saints and Damned Souls artwork</li><li>Layered music, environmental, and board audio</li><li>Unique move and capture cues for every piece type</li><li>Ghostline Tome and captured-piece Graveyard</li><li>Check, checkmate, and crimson king warning</li><li>Castling, en passant, and all promotions</li><li>FEN loading, copying, validation, and counters</li><li>Stalemate and insufficient-material detection</li><li>Threefold repetition and fifty-move rule</li></ul>':
              '<ul class="product-list mb-4"><li>Easy, Normal, and Hard AI difficulty levels</li><li>Full-square legal-move and capture highlighting</li><li>Oxblood Chapel, Crypt, and Moonlit Graveyard board themes</li><li>Compact Tome, Graveyard, FEN, AI, theme, and audio control layout</li><li>Custom Hallowed Saints and Damned Souls artwork</li><li>Layered music, environmental, and board audio</li><li>Ghostline Tome and captured-piece Graveyard</li><li>Check, checkmate, castling, en passant, and all promotions</li><li>FEN loading, copying, validation, and counters</li><li>Stalemate, threefold repetition, fifty-move, and insufficient-material detection</li></ul>',

              'The public download is v1.2.0 with the tactical AI, current artwork, complete rules, and layered audio milestone. Download the ZIP file, extract it, and run <strong>GhostlineChess.exe</strong>. Windows may display a SmartScreen warning because the prototype is currently unsigned.':
              'The public download remains v1.2.0 with the tactical AI, current artwork, complete rules, and layered audio milestone. The August visual-and-difficulty refresh is the current development build and will be packaged separately after final release testing. Download the ZIP file, extract it, and run <strong>GhostlineChess.exe</strong>. Windows may display a SmartScreen warning because the prototype is currently unsigned.'
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected Haunted Echoes text: {old[:80]}')
              text = text.replace(old, new, 1)

          page.write_text(text, encoding='utf-8')

          log = Path('development-log.html')
          log_text = log.read_text(encoding='utf-8')

          old_snapshot = '<p><strong>Website:</strong> the Ghostline Chess project page and both development logs now reflect the August 15 usability and visual refresh.</p>'
          new_snapshot = '<p><strong>Website:</strong> the Ghostline Chess project page, Haunted Echoes playable-release card, and development logs now reflect the August 15 usability and visual refresh; The 9th Vessel gameplay teaser was also restored with the complete source video.</p>'
          if old_snapshot not in log_text:
              raise SystemExit('Could not find Website snapshot paragraph')
          log_text = log_text.replace(old_snapshot, new_snapshot, 1)

          first_entry = '<article class="entry"><div class="cardlog"><header class="head"><span class="date">August 15, 2026 &middot; Haunted Echoes Studios / Ghostline Chess</span><h2>Difficulty selection and visual-readability refresh completed</h2>'
          if first_entry not in log_text:
              raise SystemExit('Could not find first August 15 Ghostline Chess entry')

          new_entry = '''<article class="entry"><div class="cardlog"><header class="head"><span class="date">August 15, 2026 &middot; Company Website / Haunted Echoes Studios</span><h2>Playable media restored and Ghostline Chess studio presentation synchronized</h2></header><div class="bodycopy"><p>A focused website repair and synchronization pass brought the Haunted Echoes presentation back in line with the current playable builds and media assets.</p><ul><li>Replaced the corrupted 27 KB The 9th Vessel gameplay-teaser asset with the complete source video and confirmed a successful GitHub Pages deployment.</li><li>Replaced the washed-out Ghostline Chess website image with the current interface screenshot showing the board, Tome, Graveyard, AI selector, board-theme selector, and audio controls.</li><li>Updated the Haunted Echoes Ghostline Chess playable-release card to feature Easy, Normal, and Hard AI difficulty levels.</li><li>Added the current full-square legal-move and capture highlighting to the public feature summary.</li><li>Added Oxblood Chapel, Crypt, and Moonlit Graveyard board themes and the refined compact desktop layout to the studio page.</li><li>Kept the published v1.2.0 download clearly separated from the newer August development refresh while final packaging remains pending.</li></ul><p><strong>Result:</strong> Haunted Echoes now presents the current Ghostline Chess development build accurately, and the public gameplay teaser media is restored.</p></div></div></article>\n\n'''

          log_text = log_text.replace(first_entry, new_entry + first_entry, 1)
          log.write_text(log_text, encoding='utf-8')
          PY

      - name: Commit website synchronization
        shell: bash
        run: |
          set -euo pipefail
          rm -f .update-haunted-echoes-chess-card
          rm -f .github/workflows/update-haunted-echoes-chess-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync Haunted Echoes Chess card and development log"
          git push
