name: Refresh Ghostline Chess website from update request

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    if: github.event.issue.title == 'Refresh Ghostline Chess v1.2.0 website now'
    runs-on: ubuntu-latest

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Refresh download links, screenshots, cards, and logs
        run: python scripts/refresh_chess_release_site.py

      - name: Commit refreshed website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add development-log.html ghostline-chess.html ghostline-chess-development-log.html haunted-echoes.html index.html images/ghostline-chess-social-card-v1-2.png images/ghostline-chess-web-card-v1-2.png
          if git diff --cached --quiet; then
            echo "No website changes were needed."
          else
            git commit -m "Update chess v1.2.0 download, screenshots, web cards, and dev logs"
            git push origin main
          fi

      - name: Close update request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" --comment "Ghostline Chess v1.2.0 website cards, screenshots, download links, and development logs were refreshed successfully."
