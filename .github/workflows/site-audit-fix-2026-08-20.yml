name: Apply Confirmed Website Audit Fixes

on:
  push:
    paths:
      - '.apply-site-audit-fixes-2026-08-20'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Apply confirmed safe fixes
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          release_url = 'https://github.com/miker1979/Ghostline-Chess/releases/download/v1.2.0/GhostlineChess-v1.2.0-win-x64.zip'
          local_zip = 'downloads/GhostlineChess-v1.2.0-win-x64.zip'

          # Normalize any remaining stale image-directory references in HTML.
          for page in root.glob('*.html'):
              text = page.read_text(encoding='utf-8')
              updated = text.replace('Images/', 'images/')
              updated = updated.replace(local_zip, release_url)
              if updated != text:
                  page.write_text(updated, encoding='utf-8')

          # Add the public Witchfinder page to the sitemap if it is not already present.
          sitemap = root / 'sitemap.xml'
          text = sitemap.read_text(encoding='utf-8')
          witchfinder = 'https://ghostlinetech.com/witchfinder-salem.html'
          if witchfinder not in text:
              block = '  <url>\n    <loc>https://ghostlinetech.com/witchfinder-salem.html</loc>\n    <lastmod>2026-08-20</lastmod>\n  </url>\n'
              text = text.replace('</urlset>', block + '</urlset>')
              sitemap.write_text(text, encoding='utf-8')

          # Remove the 1-byte placeholder; website buttons now use the real GitHub release asset.
          placeholder = root / local_zip
          if placeholder.exists():
              placeholder.unlink()

      - name: Remove one-time maintenance trigger and workflow
        shell: bash
        run: |
          rm -f .apply-site-audit-fixes-2026-08-20
          rm -f .github/workflows/site-audit-fix-2026-08-20.yml

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply confirmed website audit fixes"
          git push
