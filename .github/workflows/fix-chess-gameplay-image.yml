name: Fix Ghostline Chess Gameplay Image

on:
  push:
    paths:
      - '.fix-chess-gameplay-image'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Point pages to corrected gameplay screenshot
        shell: bash
        run: |
          set -euo pipefail
          test -f Images/ghostline-chess-gameplay.png
          python3 - <<'PY'
          from pathlib import Path

          pages = [Path('ghostline-chess.html'), Path('haunted-echoes.html')]
          old = 'images/ghostline-chess-v2.png'
          new = 'Images/ghostline-chess-gameplay.png'

          total = 0
          for page in pages:
              text = page.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'{page}: expected old gameplay image reference not found')
              page.write_text(text.replace(old, new), encoding='utf-8')
              total += count
              print(f'{page}: replaced {count} reference(s)')

          print(f'Total replacements: {total}')
          PY

      - name: Commit corrected image references
        shell: bash
        run: |
          set -euo pipefail
          rm -f .fix-chess-gameplay-image
          rm -f .github/workflows/fix-chess-gameplay-image.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use corrected Ghostline Chess gameplay screenshot"
          git push
