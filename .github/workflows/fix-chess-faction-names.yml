name: Fix Ghostline Chess Faction Names

on:
  push:
    paths:
      - '.fix-chess-faction-names'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Standardize Ghostline Chess faction names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pages = [Path('ghostline-chess.html'), Path('haunted-echoes.html')]
          total = 0
          for page in pages:
              text = page.read_text(encoding='utf-8')
              count = text.count('Damned Souls')
              if count:
                  text = text.replace('Damned Souls', 'The Damned')
                  page.write_text(text, encoding='utf-8')
                  total += count
                  print(f'{page}: replaced {count} outdated faction reference(s)')
              else:
                  print(f'{page}: no outdated Damned Souls references found')

          print(f'Total replacements: {total}')
          PY

      - name: Commit standardized faction names
        shell: bash
        run: |
          set -euo pipefail
          rm -f .fix-chess-faction-names
          rm -f .github/workflows/fix-chess-faction-names.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Standardize Ghostline Chess faction names"
          git push
