<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haunted Echoes Preview - Spectral</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="preview" src="haunted-echoes.html" title="Haunted Echoes Spectral theme preview"></iframe>
<script>
const frame=document.getElementById('preview');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  if(!doc)return;
  const style=doc.createElement('style');
  style.id='hes-spectral-theme';
  style.textContent=`
    :root{--hes-spectral:#6f9dad;--hes-spectral-light:#a8c9d2;--hes-steel:#263842;--hes-mist:#edf3f5;--hes-ice:#f8fbfc}
    body.light-mode main{background:radial-gradient(circle at 18% 12%,rgba(111,157,173,.14),transparent 31rem),linear-gradient(180deg,#f8fbfc,#edf3f5)!important;color:#20313a!important}
    body.light-mode main .hero-section{background:linear-gradient(135deg,#f9fcfd 0%,#eef4f6 55%,#dce9ed 100%)!important;border-bottom:1px solid rgba(76,123,139,.26)!important}
    body.light-mode main .section-dark{background:linear-gradient(180deg,#dfeaec,#d6e4e8)!important;border-color:rgba(76,123,139,.22)!important}
    body.light-mode main .section-label,body.light-mode main .accent-text{color:#527f90!important}
    body.light-mode main .hero-title,body.light-mode main .section-title,body.light-mode main h2,body.light-mode main h3{color:#21323a!important}
    body.light-mode main p,body.light-mode main .lead,body.light-mode main .text-muted-custom,body.light-mode main .product-list li{color:#526a74!important}
    body.light-mode main .btn-ghostline{background:linear-gradient(135deg,#86b5c3,#5c8798)!important;color:#071319!important;box-shadow:0 12px 30px rgba(76,123,139,.2)!important}
    body.light-mode main .btn-ghostline-outline{border-color:rgba(82,127,144,.62)!important;color:#355d6c!important;background:rgba(249,252,253,.68)!important}
    body.light-mode main .btn-ghostline-outline:hover{background:rgba(111,157,173,.12)!important;color:#315766!important}
    body.light-mode main .product-tag,body.light-mode main .branch-code{background:rgba(111,157,173,.11)!important;border-color:rgba(82,127,144,.3)!important;color:#416f80!important}
    body.light-mode main .ghostline-card{background:linear-gradient(145deg,#fbfdfe,#e4eef1)!important;border-color:rgba(82,127,144,.2)!important;box-shadow:0 18px 45px rgba(39,72,84,.12)!important}
    body.light-mode main .ghostline-card h2,body.light-mode main .ghostline-card h3,body.light-mode main .ghostline-card h4{color:#21323a!important}
    body.light-mode main .ghostline-card p{color:#526a74!important}
    body.light-mode main .hero-logo{border-color:rgba(111,157,173,.25)!important;box-shadow:0 0 90px rgba(111,157,173,.2)!important}
    body.light-mode main .unity-engine-badge{border-color:rgba(111,157,173,.38)!important;box-shadow:0 12px 28px rgba(39,72,84,.12)!important}
    body.dark-mode main{background:radial-gradient(circle at 18% 10%,rgba(111,157,173,.09),transparent 30rem),linear-gradient(180deg,#0b1216,#101b20)!important}
    body.dark-mode main .hero-section{background:linear-gradient(135deg,#0a1115,#111c21 58%,#17282f)!important;border-bottom-color:rgba(134,181,195,.22)!important}
    body.dark-mode main .section-dark{background:#101b20!important;border-color:rgba(134,181,195,.18)!important}
    body.dark-mode main .section-label,body.dark-mode main .accent-text{color:#8fc2d1!important}
    body.dark-mode main .hero-title,body.dark-mode main .section-title,body.dark-mode main h2,body.dark-mode main h3{color:#edf4f6!important}
    body.dark-mode main p,body.dark-mode main .lead,body.dark-mode main .text-muted-custom,body.dark-mode main li{color:#aebfc5!important}
    body.dark-mode main .btn-ghostline{background:linear-gradient(135deg,#87b8c7,#547f90)!important;color:#071319!important}
    body.dark-mode main .btn-ghostline-outline{border-color:rgba(143,194,209,.58)!important;color:#b7d6de!important}
    body.dark-mode main .product-tag,body.dark-mode main .branch-code{background:rgba(111,157,173,.11)!important;border-color:rgba(143,194,209,.26)!important;color:#a7cfda!important}
    body.dark-mode main .ghostline-card{background:linear-gradient(145deg,#111c21,#18272e)!important;border-color:rgba(111,157,173,.22)!important}
    body.dark-mode main .ghostline-card h2,body.dark-mode main .ghostline-card h3,body.dark-mode main .ghostline-card h4{color:#edf4f6!important}
    body.dark-mode main .hero-logo{border-color:rgba(143,194,209,.2)!important;box-shadow:0 0 95px rgba(111,157,173,.2)!important}
    .studio-intro-button,.studio-intro-start{border-color:rgba(143,194,209,.82)!important}.studio-intro-button:hover,.studio-intro-button:focus{background:rgba(111,157,173,.2)!important}
  `;
  doc.head.appendChild(style);
});
</script>
</body>
</html>
