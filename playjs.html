<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play JavaScript | Mike Robinson</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>

<body>

<div id="navbar"></div>

<div class="container text-center mt-5 mb-5">

  <h1>Play JavaScript</h1>

  <p class="lead">
    Practice page for JavaScript concepts including conditions, loops, and objects.
  </p>

  <p id="title">Learning JavaScript</p>

  <div class="mt-4">
    <button class="btn btn-primary mr-2 mb-2" onclick="conditions()">Conditions</button>
    <button class="btn btn-success mr-2 mb-2" onclick="loops()">Loops</button>
    <button class="btn btn-warning mb-2" onclick="objects()">Objects</button>
  </div>

  <div id="hello-text" class="mt-4"></div>

  <div class="mt-4">
    <a class="btn btn-outline-secondary" href="gallery.html">Back to Projects</a>
  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/mycode.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>

<script>
fetch("navbar.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("navbar").innerHTML = data;

    const toggleButton = document.getElementById("darkModeToggle");

    if (toggleButton) {
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-mode");
        toggleButton.textContent = "Light Mode";
      }

      toggleButton.addEventListener("click", function () {
        document.body.classList.toggle("dark-mode");

        if (document.body.classList.contains("dark-mode")) {
          localStorage.setItem("theme", "dark");
          toggleButton.textContent = "Light Mode";
        } else {
          localStorage.setItem("theme", "light");
          toggleButton.textContent = "Dark Mode";
        }
      });
    }
  });
</script>

</body>
</html>
