<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haunted Echoes Preview - Lantern / Antique Gold</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="preview" src="haunted-echoes.html" title="Haunted Echoes Lantern and Antique Gold theme preview"></iframe>
<script>
const frame=document.getElementById('preview');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  if(!doc)return;
  const style=doc.createElement('style');
  style.id='hes-lantern-theme';
  style.textContent=`
    :root{--hes-gold:#c5963b;--hes-gold-dark:#8c6422;--hes-charcoal:#1d1c1a;--hes-smoke:#6e685f;--hes-bone:#f2ede3;--hes-cream:#fbf8f2}
    body.light-mode main{background:radial-gradient(circle at 16% 12%,rgba(197,150,59,.12),transparent 30rem),linear-gradient(180deg,#fbf8f2,#f2ede3)!important;color:var(--hes-charcoal)!important}
    body.light-mode main .hero-section{background:linear-gradient(135deg,#fbf8f2 0%,#f4efe5 58%,#ebe2d3 100%)!important;border-bottom:1px solid rgba(140,100,34,.28)!important}
    body.light-mode main .section-dark{background:linear-gradient(180deg,#e9e1d5,#e2d8c9)!important;border-color:rgba(140,100,34,.24)!important}
    body.light-mode main .section-label,body.light-mode main .accent-text{color:#a97625!important}
    body.light-mode main .hero-title,body.light-mode main .section-title,body.light-mode main h2,body.light-mode main h3{color:#1e1d1a!important}
    body.light-mode main p,body.light-mode main .lead,body.light-mode main .text-muted-custom,body.light-mode main .product-list li{color:#625d55!important}
    body.light-mode main .btn-ghostline{background:linear-gradient(135deg,#ddb85f,#b67b25)!important;color:#17120a!important;box-shadow:0 12px 28px rgba(166,113,29,.18)!important}
    body.light-mode main .btn-ghostline-outline{border-color:rgba(166,113,29,.6)!important;color:#72501b!important;background:rgba(255,252,245,.65)!important}
    body.light-mode main .btn-ghostline-outline:hover{background:rgba(197,150,59,.13)!important;color:#8b5f19!important}
    body.light-mode main .product-tag,body.light-mode main .branch-code{background:rgba(197,150,59,.11)!important;border-color:rgba(166,113,29,.3)!important;color:#8d621c!important}
    body.light-mode main .ghostline-card{background:linear-gradient(145deg,#fffdf8,#eee6d9)!important;border-color:rgba(140,100,34,.22)!important;box-shadow:0 18px 45px rgba(67,53,31,.12)!important}
    body.light-mode main .ghostline-card h2,body.light-mode main .ghostline-card h3,body.light-mode main .ghostline-card h4{color:#1e1d1a!important}
    body.light-mode main .ghostline-card p{color:#625d55!important}
    body.light-mode main .hero-logo{border-color:rgba(197,150,59,.22)!important;box-shadow:0 0 84px rgba(197,150,59,.18)!important}
    body.light-mode main .unity-engine-badge{border-color:rgba(197,150,59,.36)!important;box-shadow:0 12px 28px rgba(67,53,31,.12)!important}
    body.dark-mode main{background:radial-gradient(circle at 18% 10%,rgba(197,150,59,.08),transparent 30rem),linear-gradient(180deg,#0b0b0a,#171512)!important}
    body.dark-mode main .hero-section{background:linear-gradient(135deg,#0c0c0b,#181511 58%,#211b13)!important;border-bottom-color:rgba(197,150,59,.24)!important}
    body.dark-mode main .section-dark{background:#15130f!important;border-color:rgba(197,150,59,.2)!important}
    body.dark-mode main .section-label,body.dark-mode main .accent-text{color:#d7ad55!important}
    body.dark-mode main .hero-title,body.dark-mode main .section-title,body.dark-mode main h2,body.dark-mode main h3{color:#f2ede3!important}
    body.dark-mode main p,body.dark-mode main .lead,body.dark-mode main .text-muted-custom,body.dark-mode main li{color:#bbb1a2!important}
    body.dark-mode main .btn-ghostline{background:linear-gradient(135deg,#d4ab54,#9f6d22)!important;color:#17120a!important}
    body.dark-mode main .btn-ghostline-outline{border-color:rgba(215,173,85,.6)!important;color:#e3c98f!important}
    body.dark-mode main .product-tag,body.dark-mode main .branch-code{background:rgba(197,150,59,.1)!important;border-color:rgba(215,173,85,.28)!important;color:#dfbd77!important}
    body.dark-mode main .ghostline-card{background:linear-gradient(145deg,#151411,#211d16)!important;border-color:rgba(197,150,59,.22)!important}
    body.dark-mode main .ghostline-card h2,body.dark-mode main .ghostline-card h3,body.dark-mode main .ghostline-card h4{color:#f2ede3!important}
    body.dark-mode main .hero-logo{border-color:rgba(215,173,85,.2)!important;box-shadow:0 0 90px rgba(197,150,59,.18)!important}
    .studio-intro-button,.studio-intro-start{border-color:rgba(215,173,85,.85)!important}.studio-intro-button:hover,.studio-intro-button:focus{background:rgba(197,150,59,.22)!important}
  `;
  doc.head.appendChild(style);
});
</script>
</body>
</html>
