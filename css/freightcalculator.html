<div class="calculator card shadow-sm p-4">

  <h3 class="mb-3 text-center">Freight Rate Calculator</h3>

  <div class="form-group">
    <input type="number" id="miles" class="form-control" placeholder="Miles">
  </div>

  <div class="form-group">
    <input type="number" id="rate" class="form-control" placeholder="Rate per mile ($)">
  </div>

  <div class="form-group">
    <input type="number" id="fuel" class="form-control" placeholder="Fuel cost ($)">
  </div>

  <div class="form-group">
    <input type="number" id="expenses" class="form-control" placeholder="Other expenses ($)">
  </div>

  <button class="btn btn-dark btn-block mt-2" onclick="calculateFreight()">
    Calculate
  </button>

  <div id="results" class="mt-4 text-left"></div>

</div>
