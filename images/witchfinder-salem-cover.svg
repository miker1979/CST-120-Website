<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">The Witchfinder: Salem concept cover</title>
  <desc id="desc">A dark historical horror cover with a colonial investigator, Salem meetinghouse, moonlit clouds, lantern light, and a distant burning stake.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1017"/>
      <stop offset="0.55" stop-color="#182332"/>
      <stop offset="1" stop-color="#2a1719"/>
    </linearGradient>
    <radialGradient id="moon" cx="72%" cy="18%" r="26%">
      <stop offset="0" stop-color="#dbe5f0" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#8297ad" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8297ad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern" cx="33%" cy="70%" r="30%">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#d78a36" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d78a36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#251b1b"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="900" height="1200" fill="url(#sky)"/>
  <rect width="900" height="1200" fill="url(#moon)"/>
  <circle cx="665" cy="205" r="92" fill="#c8d5e4" opacity="0.78"/>
  <path d="M0 270 C150 220 280 290 420 245 S720 220 900 300 L900 0 L0 0 Z" fill="#111821" opacity="0.72"/>
  <path d="M0 365 C160 315 300 360 470 330 S720 335 900 390" fill="none" stroke="#75889a" stroke-width="22" opacity="0.12" filter="url(#soft)"/>

  <!-- meetinghouse -->
  <g opacity="0.92">
    <rect x="510" y="500" width="245" height="210" fill="#151618" stroke="#3a3230" stroke-width="4"/>
    <polygon points="490,505 632,410 775,505" fill="#101113" stroke="#3a3230" stroke-width="4"/>
    <rect x="615" y="325" width="34" height="115" fill="#121315"/>
    <polygon points="602,335 632,280 662,335" fill="#101113"/>
    <rect x="545" y="552" width="52" height="72" fill="#c68a47" opacity="0.28"/>
    <rect x="667" y="552" width="52" height="72" fill="#c68a47" opacity="0.24"/>
    <rect x="616" y="606" width="38" height="104" fill="#08090a"/>
  </g>

  <!-- distant stake/fire -->
  <g transform="translate(760 620)">
    <rect x="0" y="0" width="10" height="155" fill="#3b2720"/>
    <path d="M-40 132 C-20 112 -18 88 -5 70 C4 95 24 99 22 70 C42 96 45 126 26 150 C9 168 -21 166 -40 132 Z" fill="#b63a24" opacity="0.85"/>
    <path d="M-18 139 C-2 120 -5 104 8 91 C11 111 27 118 19 139 C11 154 -7 154 -18 139 Z" fill="#e78b37"/>
  </g>

  <rect y="700" width="900" height="500" fill="url(#ground)"/>
  <rect width="900" height="1200" fill="url(#lantern)"/>

  <!-- investigator silhouette -->
  <g transform="translate(120 420)">
    <ellipse cx="190" cy="95" rx="67" ry="78" fill="#151416"/>
    <path d="M110 168 C128 135 248 132 270 175 L323 540 L35 540 Z" fill="#111113"/>
    <path d="M112 169 L74 330 L123 342 L153 220" fill="#181719"/>
    <path d="M265 178 L333 318 L290 339 L232 226" fill="#181719"/>
    <path d="M100 63 Q190 20 286 70 L274 91 Q192 58 111 91 Z" fill="#0b0b0d"/>
    <rect x="145" y="30" width="98" height="50" rx="10" fill="#0b0b0d"/>
    <!-- lantern -->
    <g transform="translate(72 315)">
      <rect x="0" y="38" width="70" height="96" rx="8" fill="#2c2520" stroke="#9e6c35" stroke-width="4"/>
      <rect x="12" y="52" width="46" height="62" fill="#ffc86b" opacity="0.95"/>
      <path d="M12 38 Q35 0 58 38" fill="none" stroke="#9e6c35" stroke-width="6"/>
    </g>
    <!-- warrant -->
    <g transform="translate(268 330) rotate(7)">
      <rect width="128" height="172" rx="5" fill="#d9c8a7" stroke="#725642" stroke-width="4"/>
      <line x1="20" y1="38" x2="108" y2="38" stroke="#725642" stroke-width="6"/>
      <line x1="20" y1="62" x2="102" y2="62" stroke="#725642" stroke-width="4"/>
      <line x1="20" y1="82" x2="95" y2="82" stroke="#725642" stroke-width="4"/>
      <circle cx="92" cy="132" r="20" fill="#7d1f30"/>
    </g>
  </g>

  <!-- subtle crowd -->
  <g fill="#0d0d0f" opacity="0.9">
    <circle cx="470" cy="760" r="26"/><rect x="446" y="784" width="48" height="92"/>
    <circle cx="530" cy="778" r="22"/><rect x="510" y="798" width="40" height="80"/>
    <circle cx="600" cy="748" r="24"/><rect x="578" y="772" width="44" height="102"/>
    <circle cx="680" cy="785" r="21"/><rect x="660" y="804" width="40" height="75"/>
  </g>

  <rect x="0" y="0" width="900" height="1200" fill="none" stroke="#7d1f30" stroke-width="14"/>
  <text x="450" y="112" text-anchor="middle" fill="#e9dfcf" font-family="Georgia, serif" font-size="46" letter-spacing="10">THE WITCHFINDER</text>
  <text x="450" y="178" text-anchor="middle" fill="#b94359" font-family="Georgia, serif" font-size="82" font-weight="700" letter-spacing="8">SALEM</text>
  <line x1="246" y1="205" x2="654" y2="205" stroke="#8e1730" stroke-width="3"/>
  <text x="450" y="1135" text-anchor="middle" fill="#d4c5b5" font-family="Arial, sans-serif" font-size="24" letter-spacing="6">1692 • HISTORICAL HORROR</text>
</svg>