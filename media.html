<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media | Mike Robinson</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

  <style>
    .blink_me_alarm {
      color: red;
      text-transform: uppercase;
      text-shadow: 0 0 8px red;
      animation: blinker 0.8s linear infinite;
    }

    .div1 {
      display: inline-block;
      border: 2px solid black;
      padding: 15px;
      margin-top: 20px;
      background-color: white;
      transition: transform 0.8s;
    }

    .div1:hover {
      transform: rotate(360deg);
    }

    @keyframes blinker {
      50% {
        opacity: 0;
      }
    }
  </style>
</head>

<body>

<div id="navbar"></div>

<div class="container text-center mt-5 mb-5">

  <h1>Video and Audio Media</h1>
  <p class="text-muted mb-5">
    Practice media content demonstrating embedded video, hosted video, audio, and simple CSS animation effects.
  </p>

  <div class="embed-responsive embed-responsive-16by9 mb-3">
    <iframe
      class="embed-responsive-item"
      src="https://www.youtube.com/embed/JdVLnLKC-pk"
      title="Grand Canyon University Doctrinal Statement"
      allowfullscreen>
    </iframe>
  </div>
  <h4 class="mb-4">Grand Canyon University Doctrinal Statement</h4>

  <video class="w-100 mb-2" controls>
    <source src="media/student_video.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <h4 class="blink_me_alarm mb-4">Student Support Video Clip</h4>

  <audio controls class="w-100 mb-2">
    <source src="media/student_audio.mp3" type="audio/mp3">
    Your browser does not support the audio tag.
  </audio>
  <h4 class="blink_me_alarm mb-4">Student Support Audio Clip</h4>

  <div class="div1 mt-3" style="width: 300px;">
    GCU is a great university
  </div>

</div>

<footer class="text-center mt-5">
  <div id="copyright"></div>
</footer>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
<script src="js/copyright.js"></script>

<script>
fetch("navbar.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("navbar").innerHTML = data;

    const toggleButton = document.getElementById("darkModeToggle");

    if (toggleButton) {
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-mode");
        toggleButton.textContent = "Light Mode";
      }

      toggleButton.addEventListener("click", function () {
        document.body.classList.toggle("dark-mode");

        if (document.body.classList.contains("dark-mode")) {
          localStorage.setItem("theme", "dark");
          toggleButton.textContent = "Light Mode";
        } else {
          localStorage.setItem("theme", "light");
          toggleButton.textContent = "Dark Mode";
        }
      });
    }
  });
</script>

</body>
</html>
