<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Mike Robinson</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>

<body>

<div id="navbar"></div>

<div class="container mt-5 mb-5">
  <h1 class="text-center">Contact</h1>
  <p class="text-center lead">
    Connect with me professionally through LinkedIn, GitHub, or email.
  </p>

  <div class="row mt-5">
    <div class="col-md-8 offset-md-2">
      <div class="card shadow-sm p-4">

        <h3 class="mb-4">Professional Links</h3>

        <p>
          <strong>LinkedIn:</strong><br>
          <a href="https://www.linkedin.com/in/michael-robinson-391917b3" target="_blank">
            linkedin.com/in/michael-robinson-391917b3
          </a>
        </p>

        <p>
          <strong>GitHub:</strong><br>
          <a href="https://github.com/miker1979" target="_blank">
            github.com/miker1979
          </a>
        </p>

        <p>
          <strong>Email:</strong><br>
          <a href="mailto:mike.robinson1979@gmail.com">
            mike.robinson1979@gmail.com
          </a>
        </p>

        <hr>

        <h3 class="mb-3">Send a Message</h3>

        <form action="https://formspree.io/f/mpqygnyz" method="POST">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Your name" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Your email" required>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here" required></textarea>
          </div>

          <input type="hidden" name="_subject" value="New portfolio message from Mike Robinson website">
          <input type="hidden" name="_next" value="https://miker1979.github.io/responsive-multi-page-website/thankyou.html">

          <button type="submit" class="btn btn-primary">Send</button>
        </form>

      </div>
    </div>
  </div>
</div>

<footer class="text-center mt-5">
  <div id="copyright"></div>
</footer>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
<script src="js/copyright.js"></script>

<script>
fetch("navbar.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("navbar").innerHTML = data;

    const toggleButton = document.getElementById("darkModeToggle");

    if (toggleButton) {
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-mode");
        toggleButton.textContent = "Light Mode";
      }

      toggleButton.addEventListener("click", function () {
        document.body.classList.toggle("dark-mode");

        if (document.body.classList.contains("dark-mode")) {
          localStorage.setItem("theme", "dark");
          toggleButton.textContent = "Light Mode";
        } else {
          localStorage.setItem("theme", "light");
          toggleButton.textContent = "Dark Mode";
        }
      });
    }
  });
</script>

</body>
</html>
