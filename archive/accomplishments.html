<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Accomplishments | Mike Robinson</title>
<link href="../css/styles.css" rel="stylesheet"/>
<link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div id="navbar"></div>
<div class="container mt-5 mb-5">
<h1 class="text-center">Accomplishments</h1>
<div class="row mt-5">
<div class="col-md-6 mb-4">
<div class="card shadow-sm p-4 h-100">
<h3>Associate Degree</h3>
<p>
          Associate degree documentation and academic achievement record.
        </p>
<a aria-disabled="true" class="btn btn-primary shadow-sm disabled text-muted" target="_blank" title="Document was not included in the uploaded website folder.">
          View Document
        </a>
</div>
</div>
<div class="col-md-6 mb-4">
<div class="card shadow-sm p-4 h-100">
<h3>Honor Roll Certificate</h3>
<p>
          Recognition for academic performance and achievement.
        </p>
<a aria-disabled="true" class="btn btn-primary shadow-sm disabled text-muted" target="_blank" title="Document was not included in the uploaded website folder.">
          View Document
        </a>
</div>
</div>
</div>
</div>
<footer class="text-center mt-5">
<div id="copyright"></div>
</footer>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
<script src="../js/copyright.js"></script>
<script>
fetch("../navbar.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("navbar").innerHTML = data;

    const toggleButton = document.getElementById("darkModeToggle");

    if (toggleButton) {
      if (localStorage.getItem("ghostlineTheme") === "dark") {
        document.body.classList.add("dark-mode");
        toggleButton.textContent = "Light Mode";
      }

      toggleButton.addEventListener("click", function () {
        document.body.classList.toggle("dark-mode");

        if (document.body.classList.contains("dark-mode")) {
          localStorage.setItem("ghostlineTheme", "dark");
          toggleButton.textContent = "Light Mode";
        } else {
          localStorage.setItem("ghostlineTheme", "light");
          toggleButton.textContent = "Dark Mode";
        }
      });
    }
  });
</script>
</body>
</html>
