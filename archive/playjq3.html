<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play jQuery 3 | Mike Robinson</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/styles.css">

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script>
    function clicked() {
      alert("I was clicked");
    }

    function displayUsers() {
      function User(firstName, lastName, age) {
        this.firstName = firstName;
        this.lastName = lastName;
        this.age = age;
      }

      var users = [];
      users.push(
        new User("John", "Lennon", 80),
        new User("Paul", "McCartney", 78),
        new User("George", "Harrison", 53),
        new User("Ringo", "Starr", 80)
      );

      var x = 0;

      for (var i = 0; i < users.length; i++) {
        var user = users[i];
        var rowStyle = x % 2 === 0 ? "#FFFFFF" : "#F0F0F0";

        var markup =
          "<tr>" +
            "<td>" + user.firstName + "</td>" +
            "<td>" + user.lastName + "</td>" +
            "<td>" + user.age + "</td>" +
          "</tr>";

        $("#users").find("tbody").append(markup);

        var lastRow = $("#users").find("tbody").find("tr").last();
        lastRow.attr("id", x);
        lastRow.css("background-color", rowStyle);

        $(lastRow.find("td").get(0)).attr("id", x + "-1");
        $(lastRow.find("td").get(1)).attr("id", x + "-2");
        $(lastRow.find("td").get(2)).attr("id", x + "-3");

        x++;
      }
    }

    $(document).ready(displayUsers);
  </script>
</head>

<body>

<div id="navbar"></div>

<div class="container mt-5 mb-5 text-center">
  <h1>Play jQuery 3</h1>
  <p class="lead">Dynamic table generation with jQuery.</p>

  <button class="btn btn-secondary mb-3" onclick="clicked()">Click Me</button>

  <table id="users" class="table table-bordered w-100 bg-white">
    <thead class="thead-light">
      <tr>
        <th width="33%">First Name</th>
        <th width="33%">Last Name</th>
        <th width="33%">Age</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <div class="mt-4">
    <a href="gallery.html" class="btn btn-outline-secondary">Back to Projects</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>

<script>
fetch("../navbar.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("navbar").innerHTML = data;

    const toggleButton = document.getElementById("darkModeToggle");

    if (toggleButton) {
      if (localStorage.getItem("ghostlineTheme") === "dark") {
        document.body.classList.add("dark-mode");
        toggleButton.textContent = "Light Mode";
      }

      toggleButton.addEventListener("click", function () {
        document.body.classList.toggle("dark-mode");

        if (document.body.classList.contains("dark-mode")) {
          localStorage.setItem("ghostlineTheme", "dark");
          toggleButton.textContent = "Light Mode";
        } else {
          localStorage.setItem("ghostlineTheme", "light");
          toggleButton.textContent = "Dark Mode";
        }
      });
    }
  });
</script>

</body>
</html>
